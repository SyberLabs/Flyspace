name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run has nothing left to prove. Cancelling in-flight work for the
# same ref keeps a rapid push sequence from queueing behind itself — except on
# main, where every commit's result is a record worth having.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege by default. Nothing in this workflow writes to the repo, and
# a job that needs more says so itself.
permissions:
  contents: read

# Runner images are pinned rather than `latest`: `ubuntu-latest` moves to
# Ubuntu 26 in October 2026, and a green build should not turn red because a
# label changed underneath it. Dependabot bumps actions, not runner labels, so
# raising these is a deliberate manual review.
jobs:
  # ============================================
  # The main gate: the five checks the README promises.
  # ============================================
  build:
    name: Typecheck, Test & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # .nvmrc is the single source of truth, so a contributor's local
          # Node and CI's cannot drift apart silently.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Blocking gates — these protect the green build (Phase 1) and the
      # test suite (Phase 4).
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Blocking as of Phase 5: lint errors = 0. ESLint exits non-zero only on
      # errors, so this fails CI on new errors while pre-existing warnings
      # (no-explicit-any, unused vars, react-hooks correctness) stay advisory.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Golden-path e2e (apex A3): drives the real built app — spawn Investor
      # shell → blocks render → wires live → mock-LLM Think streams → persists
      # across reload. The LLM is the OMNI_E2E server double (no keys needed).
      # This guards the UI wiring layer where unit tests can't see.
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # The browser binary caches; the OS libraries it links against do not,
      # so on a hit we still install those and only skip the download.
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cached browser)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E (golden path)
        run: npm run test:e2e

      - name: Upload e2e artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ============================================
  # No provider key may reach the browser.
  #
  # The property the whole server-proxy architecture exists for, asserted by
  # machine instead of by memory. Builds with a unique canary value standing in
  # for every secret env var, then fails if any canary is in `.next/static`.
  #
  # Its own job because it needs a DIFFERENT build environment from the main
  # one: you cannot prove secrets stay out of the bundle without building with
  # secrets present.
  # ============================================
  bundle:
    name: Client bundle carries no secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Salted per run, so a scan can only ever pass against the bundle this
      # same run built — never against a stale artifact.
      # Only well-formed canary lines reach GITHUB_ENV: stray output from a
      # future npm version must not be able to inject an arbitrary variable.
      # If the filter matched nothing, the build runs with no secrets set and
      # the scan exits 2 rather than reporting a meaningless pass.
      - name: Generate canary secrets
        run: |
          npm run --silent scan:bundle -- --canaries > canaries.env
          grep -E '^[A-Z_]+=OMNI-CANARY-[A-Za-z0-9_-]+$' canaries.env >> "$GITHUB_ENV"
          echo "Seeded $(grep -c . canaries.env) canary value(s) into the build env."
          rm -f canaries.env
        env:
          OMNI_CANARY_SALT: ${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build with canary secrets in the environment
        run: npm run build

      - name: Scan client bundle
        run: npm run scan:bundle

  # ============================================
  # The inference ledger against a real Postgres.
  #
  # Its own job so the main gate stays dependency-free: `npm test` skips the
  # integration file unless OMNI_TEST_DATABASE_URL is set. This is the only
  # place the CHECK constraints, the foreign keys, the cascade, the recursive
  # lineage walk and the migration runner are actually executed rather than
  # asserted about.
  # ============================================
  ledger:
    name: Inference Ledger (Postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: omni
          POSTGRES_PASSWORD: omni
          POSTGRES_DB: omni_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      OMNI_TEST_DATABASE_URL: postgres://omni:omni@localhost:5432/omni_test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Proves the runner and the migrations themselves, not just the SQL text.
      - name: Migrate
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://omni:omni@localhost:5432/omni_test

      # Re-running must be a no-op: migrations are IF NOT EXISTS, constraint
      # adds are guarded on pg_constraint, and applied files are recorded.
      - name: Migrate again (idempotent)
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://omni:omni@localhost:5432/omni_test

      - name: Test (integration included)
        run: npm test

  # ============================================
  # Dependency audit.
  #
  # Only production dependencies block. A dev-only advisory (eslint's transitive
  # humanfs, vitest's mocker) is worth a Dependabot PR but is not worth failing
  # a build over: it never ships. Reported either way so it stays visible.
  # ============================================
  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit everything (advisory)
        run: npm audit || true
